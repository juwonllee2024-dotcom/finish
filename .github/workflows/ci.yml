name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package
        shell: bash
        run: |
          mkdir -p .artifacts
          npm pack --pack-destination .artifacts

      - name: Clean package smoke test
        shell: bash
        run: |
          mkdir -p .smoke
          cd .smoke
          npm init -y
          npm install ../.artifacts/finish-0.1.0.tgz
          node node_modules/finish/dist/cli.js demo --output demo.html
          test -s demo.html
